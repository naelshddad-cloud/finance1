en:"Home|Transactions|Reports|Budget|Savings|Settings|Total balance|Bank account|Cash wallet|Today's income|Today's expenses|Today's net|Month income|Month expenses|Month net|+ Income|− Expense|⇄ Transfer|Amount|Source|Account|Date|Note|Payment method|Category|Save|Cancel|Delete|Edit|Search|All|Income|Expense|Day|Week|Month|Year|Saved|Target|Due date|Progress|New goal|Name|Limit|Remaining|Over limit!|Avg daily spending|Top categories|Month comparison|Opening balance|Language|Currency|Export Excel|Backup|Restore|No data|From|To|Deposit|Available|Reserved for savings|Print / PDF|Salary|Extra work|Bonus|Gift|Other income|Food|Restaurants|Transport|Rent|Utilities|Internet|Shopping|Clothing|Health|Entertainment|Subscriptions|Other|Cash|Card|Bank transfer",
nl:"Start|Transacties|Rapporten|Budget|Sparen|Instellingen|Totaal vermogen|Bankrekening|Contant geld|Inkomen vandaag|Uitgaven vandaag|Netto vandaag|Inkomen maand|Uitgaven maand|Netto maand|+ Inkomen|− Uitgave|⇄ Overboeking|Bedrag|Bron|Rekening|Datum|Notitie|Betaalmethode|Categorie|Opslaan|Annuleren|Verwijderen|Bewerken|Zoeken|Alles|Inkomen|Uitgave|Dag|Week|Maand|Jaar|Gespaard|Doel|Streefdatum|Voortgang|Nieuw doel|Naam|Limiet|Resterend|Limiet overschreden!|Gem. uitgaven per dag|Top categorieën|Maandvergelijking|Beginsaldo|Taal|Valuta|Exporteer Excel|Back-up|Herstellen|Geen gegevens|Van|Naar|Storten|Beschikbaar|Gereserveerd|Afdrukken / PDF|Salaris|Extra werk|Bonus|Cadeau|Overig inkomen|Eten|Restaurants|Vervoer|Huur|Gas, water, licht|Internet|Winkelen|Kleding|Gezondheid|Vrije tijd|Abonnementen|Overig|Contant|Pinpas|Bankoverschrijving"};
for(const k in L)L[k]=L[k].split("|");
const IN=["salary","extra","bonus","gift","otherin"],OUT="food,rest,trans,rent,util,net,shop,cloth,health,fun,subs,otherout".split(","),AC=["bank","cash"],PM=["pmcash","pmcard","pmbank"];
const NV=[["home","🏠"],["tx","🧾"],["reports","📊"],["budget","💶"],["savings","🎯"],["settings","⚙️"]];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>iso(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const t=k=>L[S.lang][K.indexOf(k)]||k,f=n=>(Math.round(n*100)/100).toLocaleString(S.lang=="ar"?"ar-u-nu-latn":S.lang,{minimumFractionDigits:2,maximumFractionDigits:2})+" "+S.cur;
const sum=p=>S.tx.filter(p).reduce((s,x)=>s+x.amt,0),bal=a=>S.open[a]+sum(x=>x.type=="in"&&x.acc==a)-sum(x=>x.type=="out"&&x.acc==a)+sum(x=>x.type=="tr"&&x.to==a)-sum(x=>x.type=="tr"&&x.from==a),rsv=a=>sum(x=>x.type=="sv"&&x.acc==a),gs=g=>sum(x=>x.type=="sv"&&x.g==g.id);

function form(ty,x){x=x||{};let h=`<h3>${t({in:"addIn",out:"addOut",tr:"transfer",sv:"contribute"}[ty])}</h3><label>${t("amount")}<input id=f_a type=number inputmode=decimal step=0.01 min=0 value="${x.amt||""}"></label>`;

else if(ty=="sv")h+=`<label>${t("savings")}<select id=f_g>${S.goals.map(g=>`<option value="${g.id}" ${g.id==x.g?"selected":""}>${e(g.name)}</option>`).join("")}</select></label>`;

function sub(ty,id){const a=Math.round(+$("#f_a").value*100)/100;if(!(a>0))return $("#f_a").focus();const x={id:id||uid(),type:ty,amt:a,date:$("#f_d").value||today(),note:$("#f_n").value};
if(ty=="in"||ty=="out"){x.cat=$("#f_c").value;x.acc=$("#f_k").value}if(ty=="out")x.pay=$("#f_p").value;
if(ty=="tr"){x.from=$("#f_f").value;x.to=$("#f_t").value;if(x.from==x.to)return}
if(ty=="sv"){const g=S.goals.find(g=>g.id==$("#f_g").value);if(!g)return;x.g=g.id;x.acc=g.acc}
const i=S.tx.findIndex(y=>y.id==id);i<0?S.tx.push(x):S.tx[i]=x;sv();cm();R()}
function dl(b,id){if(b.dataset.s){S.tx=S.tx.filter(x=>x.id!=id);sv();cm();R()}else{b.dataset.s=1;b.textContent="✔ "+t("del")+"?"}}
const ed=id=>{const x=S.tx.find(y=>y.id==id);if(x)form(x.type,x)};
function gf(g){g=g||{};mo(`<h3>${t("newGoal")}</h3><label>${t("name")}<input id=g_n value="${e(g.name)}"></label><label>${t("target")}<input id=g_t type=number inputmode=decimal value="${g.target||""}"></label><label>${t("due")}<input id=g_d type=date value="${g.due||""}"></label><label>${t("account")}<select id=g_a>${opt(AC,g.acc||"bank",1)}</select></label><div class=row><button class=btn onclick=cm()>${t("cancel")}</button><button class="btn p" onclick="gsub('${g.id||""}')">${t("save")}</button></div>${g.id?`<button class="btn d" onclick="gdl(this,'${g.id}')">${t("del")}</button>`:""}`)}
function gsub(id){const n=$("#g_n").value.trim(),tg=+$("#g_t").value;if(!n||!(tg>0))return;const g={id:id||uid(),name:n,target:tg,due:$("#g_d").value,acc:$("#g_a").value};if(id){const o=S.goals.find(y=>y.id==id);S.tx.forEach(x=>{if(x.g==id)x.acc=g.acc});Object.assign(o,g)}else S.goals.push(g);sv();cm();R()}
function gdl(b,id){if(b.dataset.s){S.goals=S.goals.filter(g=>g.id!=id);S.tx=S.tx.filter(x=>x.g!=id);sv();cm();R()}else{b.dataset.s=1;b.textContent="✔ "+t("del")+"?"}}
function txl(x){const ic={in:"＋",out:"−",tr:"⇄",sv:"🎯"}[x.type],sg=x.type=="in"?"pos":x.type=="out"?"neg":"",nm=x.type=="tr"?`${t(x.from)} → ${t(x.to)}`:x.type=="sv"?(S.goals.find(g=>g.id==x.g)||{}).name||"":t(x.cat);

function LST(){const q=Q.q.toLowerCase(),r=S.tx.filter(x=>(!Q.ty||x.type==Q.ty)&&(!Q.ac||x.acc==Q.ac||x.from==Q.ac||x.to==Q.ac)&&(!Q.a||x.date>=Q.a)&&(!Q.b||x.date<=Q.b)&&(!q||(x.note||"").toLowerCase().includes(q)||t(x.cat||"").toLowerCase().includes(q)||String(x.amt).includes(q))).sort((a,b)=>b.date.localeCompare(a.date));$("#lst").innerHTML=r.map(txl).join("")||`<p><small>${t("empty")}</small></p>`}
function cmp(){const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(iso(d).slice(0,7))}
const D=ms.map(m=>{const i=sum(x=>x.type=="in"&&x.date.slice(0,7)==m),o=sum(x=>x.type=="out"&&x.date.slice(0,7)==m);return{m,i,o,n:i-o}}),mx=Math.max(1,...D.flatMap(d=>[d.i,d.o])),mn=Math.min(0,...D.map(d=>d.n)),y=v=>8+(mx-v)/(mx-mn)*110;

const VW={

tx(){return qa()+`<input placeholder="🔍 ${t("search")}" value="${e(Q.q)}" oninput="Q.q=this.value;LST()"><div class=g2 style="margin:8px 0"><select onchange="Q.ty=this.value;LST()"><option value="">${t("all")}</option>${["in","out","tr"].map(x=>`<option value=${x} ${Q.ty==x?"selected":""}>${t({in:"income",out:"expense",tr:"transfer"}[x])}</option>`).join("")}</select><select onchange="Q.ac=this.value;LST()"><option value="">${t("account")}: ${t("all")}</option>${opt(AC,Q.ac,1)}</select><input type=date value="${Q.a}" onchange="Q.a=this.value;LST()"><input type=date value="${Q.b}" onchange="Q.b=this.value;LST()"></div><div id=lst></div>`},
reports(){const r=rng(P),T=today(),i=tot("in",r),o=tot("out",r),days=Math.max(1,Math.round((new Date(Math.min(new Date(r[1]),new Date(T)))-new Date(r[0]))/864e5)+1),cats=OUT.map(c=>[c,tot("out",r,c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
return`<div class=chips>${["day","week","month","year"].map(p=>`<button class="btn ${P==p?"on":""}" onclick="P='${p}';R()">${t(p)}</button>`).join("")}</div><div class=g2>${card(t("income"),i,"pos")}${card(t("expense"),o,"neg")}</div><div class=g2 style="margin-top:8px">${card(t("net"),i-o,cls(i-o))}${card(t("savings"),tot("sv",r))}</div><div class=c style="margin-top:8px"><small>${t("avg")}</small><b>${f(o/days)}</b></div><div class=c><b>${t("top")}</b>${cats.map(([c,v])=>`<div class=row style="margin-top:6px"><small>${t(c)}</small><small>${f(v)}</small></div><div class=bar style="margin:2px 0"><i style="width:${v/cats[0][1]*100}%;background:var(--r)"></i></div>`).join("")||`<small>${t("empty")}</small>`}</div><div class=c><b>${t("compare")}</b>${cmp()}</div>`},
budget(){const m=rng("month");return["day","week","month"].map(k=>bl(t(k),tot("out",rng(k)),S.bud[k],k)).join("")+`<h4>${t("category")} (${t("month")})</h4>`+OUT.map(c=>bl(t(c),tot("out",m,c),S.bud.cat[c],"c_"+c)).join("")},
savings(){const tr=S.goals.reduce((s,g)=>s+gs(g),0);return`<div class=hero><small>${t("savings")}</small><h1>${f(tr)}</h1></div><div class=g2>${AC.map(a=>`<div class=c><small>${t(a)} · ${t("available")}</small><b>${f(bal(a)-rsv(a))}</b><small>${t("reserved")}: ${f(rsv(a))}</small></div>`).join("")}</div><button class="btn p" style="width:100%;margin:8px 0" onclick="gf()">+ ${t("newGoal")}</button>`+S.goals.map(g=>{const s=gs(g),p=Math.min(100,s/g.target*100);return`<div class=c><div class=row><b>🎯 ${e(g.name)}</b><small>${t(g.acc)}</small></div><div class=bar><i style="width:${p}%"></i></div><div class=row><small>${t("saved")}: ${f(s)} / ${f(g.target)} (${Math.round(p)}%)</small></div><small>${t("remaining")}: ${f(Math.max(0,g.target-s))}${g.due?" · "+t("due")+": "+g.due:""}</small><div class=row style="margin-top:8px"><button class="btn p" onclick="form('sv',{g:'${g.id}'})">${t("contribute")}</button><button class=btn onclick="gf(S.goals.find(y=>y.id=='${g.id}'))">${t("edit")}</button></div></div>`}).join("")},
settings(){return`<div class=c><label>${t("lang")}<select onchange="S.lang=this.value;sv();R()">${[["ar","العربية"],["en","English"],["nl","Nederlands"]].map(([k,n])=>`<option value=${k} ${S.lang==k?"selected":""}>${n}</option>`).join("")}</select></label><label>${t("currency")}<input value="${e(S.cur)}" maxlength=4 onchange="S.cur=this.value||'€';sv();R()"></label>${AC.map(a=>`<label>${t("opening")} — ${t(a)}<input type=number inputmode=decimal step=0.01 value="${S.open[a]||""}" onchange="S.open['${a}']=+this.value||0;sv();R()"></label>`).join("")}</div><div class=g2><button class=btn onclick=csv()>${t("export")}</button><button class=btn onclick="try{print()}catch(x){}">${t("print")}</button><button class=btn onclick="out(JSON.stringify(S),'my-daily-finance-backup.json')">${t("backup")}</button><button class=btn onclick=rest()>${t("restore")}</button></div>`}};
function R(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=="ar"?"rtl":"ltr";$("#nav").innerHTML=NV.map(([k,i])=>`<button class="${V==k?"on":""}" onclick="V='${k}';R();scrollTo(0,0)"><b>${i}</b>${t(k)}</button>`).join("");$("#app").innerHTML=VW[V]();if(V=="tx")LST()}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
R();
</script></body></html>
